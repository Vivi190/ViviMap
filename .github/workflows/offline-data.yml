name: Offline data

# Manual: builds the Istanbul offline packages for Phase 4 and reports their sizes, so "ship inside the app
# or download separately" is decided on real numbers. The app does not use these files yet.
#   - Valhalla routing tiles (on-device routing via Rallista/valhalla-mobile, MIT)
#   - Vector map tiles in the OpenMapTiles schema our map style already uses (Planetiler → PMTiles)
# Data © OpenStreetMap contributors (ODbL), extract from Geofabrik.
on:
  workflow_dispatch:

permissions:
  contents: write # publishes the packages as a release of this (private) repo; TestFlight builds pull them

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BBOX: "28.0,40.75,29.95,41.6" # west,south,east,north: greater Istanbul, same box as the hazard data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Istanbul extract
        run: |
          # Retried: one refused connection to the mirror must not cost the whole build.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 30 -o turkey.osm.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          osmium extract -b "$BBOX" turkey.osm.pbf -o istanbul.osm.pbf --overwrite
          rm turkey.osm.pbf
          osmium fileinfo -e istanbul.osm.pbf | grep -E "Number of (nodes|ways)|Timestamp" || true

      - name: Valhalla routing tiles
        run: |
          mkdir -p valhalla && cp istanbul.osm.pbf valhalla/
          # Same engine version as valhalla-mobile 0.6.x (Valhalla 3.9.0), so the app can read these tiles.
          docker run --rm -v "$PWD/valhalla:/data" ghcr.io/valhalla/valhalla:3.9.0 bash -euo pipefail -c '
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/valhalla_tiles.tar \
              --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json istanbul.osm.pbf
            valhalla_build_tiles -c valhalla.json istanbul.osm.pbf
            valhalla_build_extract -c valhalla.json -v'
          sudo chown -R "$USER" valhalla

      - name: Vector map tiles
        run: |
          curl -fsSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          java -Xmx5g -jar planetiler.jar --osm-path=istanbul.osm.pbf --output=istanbul.pmtiles \
            --download --maxzoom=14 --force

      - name: Place search index
        run: |
          osmium tags-filter istanbul.osm.pbf nwr/name -o named.osm.pbf --overwrite
          osmium export named.osm.pbf -f geojsonseq -o named.geojsonseq --overwrite
          python3 Tools/search/build_index.py --self-test
          python3 Tools/search/build_index.py named.geojsonseq places.sqlite
          # How much of the city has opening hours mapped, and in which forms: what a parser in the app must read.
          python3 - <<'PY'
          import collections, sqlite3
          db = sqlite3.connect("places.sqlite")
          kinds = collections.Counter(c for (c,) in db.execute("SELECT p.category FROM place p JOIN hours h ON h.id = p.id"))
          print("opening_hours by kind:", kinds.most_common(20))
          forms = collections.Counter(v for (v,) in db.execute("SELECT opening_hours FROM hours"))
          print("distinct forms:", len(forms))
          for form, count in forms.most_common(40):
              print(f"{count:6} {form}")
          PY

      - name: Business search index
        run: |
          # Shops, restaurants, offices: the places theme of Overture Maps for the same box. It is not
          # OpenStreetMap data and has other licences, so it gets a file of its own (Tools/search/build_pois.py).
          python3 -m venv overture-env
          overture-env/bin/pip install --quiet overturemaps==2.1.1
          overture-env/bin/overturemaps releases latest | tee overture-release.txt
          overture-env/bin/overturemaps download --bbox="$BBOX" -f geojsonseq --type=place -o overture-places.geojsonseq
          python3 Tools/search/build_pois.py --self-test
          python3 Tools/search/fetch_chargers.py --self-test
          # With the public charging stations of the energy regulator's register (a file of the repository,
          # Tools/search/fetch_chargers.py): Overture knows a twentieth of them.
          python3 Tools/search/build_pois.py overture-places.geojsonseq pois.sqlite Tools/search/chargers-istanbul.json
          rm overture-places.geojsonseq

      - name: Map fonts (offline labels)
        run: |
          # The stacks our style uses; ranges for Latin, Turkish (ğ ı ş İ in 256-511) and punctuation (’ – …).
          for stack in "Noto Sans Regular" "Noto Sans Bold" "Noto Sans Italic"; do
            mkdir -p "fonts/$stack"
            for range in 0-255 256-511 8192-8447; do
              curl -fsSL -o "fonts/$stack/$range.pbf" "https://tiles.openfreemap.org/fonts/${stack// /%20}/$range.pbf"
            done
          done
          (cd fonts && zip -qr ../fonts.zip .)

      - name: Sizes
        run: |
          {
            echo "OSM extract:          $(du -h istanbul.osm.pbf | cut -f1)"
            echo "Valhalla tiles (tar): $(du -h valhalla/valhalla_tiles.tar | cut -f1)"
            echo "Map tiles (pmtiles):  $(du -h istanbul.pmtiles | cut -f1)"
            echo "Search index:         $(du -h places.sqlite | cut -f1)"
            echo "Business index:       $(du -h pois.sqlite | cut -f1), Overture $(tail -1 overture-release.txt)"
            gzip -9 -c valhalla/valhalla_tiles.tar > valhalla_tiles.tar.gz
            echo "Valhalla tiles (gz):  $(du -h valhalla_tiles.tar.gz | cut -f1)"
          } | tee sizes.txt

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="offline-data-$(date -u +%Y%m%d)-${{ github.run_number }}"
          cp valhalla/valhalla_tiles.tar .
          gh release create "$tag" valhalla_tiles.tar istanbul.pmtiles places.sqlite pois.sqlite fonts.zip sizes.txt \
            --repo "${{ github.repository }}" --prerelease --title "$tag" \
            --notes "Istanbul offline packages: Valhalla 3.9.0 tiles, OpenMapTiles PMTiles, search indexes, fonts.

          valhalla_tiles.tar, istanbul.pmtiles and places.sqlite: © OpenStreetMap contributors, Open Database License 1.0 (https://www.openstreetmap.org/copyright).

          pois.sqlite: the places theme of the Overture Maps Foundation (https://docs.overturemaps.org/attribution/). Its records come from Meta, Microsoft and others under CDLA-Permissive-2.0 (https://cdla.dev/permissive-2-0/), from Foursquare under Apache-2.0 (https://www.apache.org/licenses/LICENSE-2.0) and from AllThePlaces under CC0-1.0. Its charging stations are the energy regulator's register as published by İstanbul Büyükşehir Belediyesi (İBB Açık Veri Lisansı, https://data.ibb.gov.tr/license). It holds no OpenStreetMap data."
