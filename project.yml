# XcodeGen spec — the .xcodeproj is generated (CI runs `xcodegen generate`) and never committed.
name: Atlas
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The first TestFlight upload went out as 1.0 (1); stay on the 1.0 train, builds count up from the run number.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by the TestFlight workflow from the provisioning profile / team secrets.
    ATLAS_BUNDLE_ID: com.vivimap.atlas
    ATLAS_TEAM_ID: ""
    ATLAS_PROFILE_NAME: ""

packages:
  AtlasKit:
    path: Packages/AtlasKit

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AtlasKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleDevelopmentRegion: tr
        # XcodeGen otherwise hard-codes 1.0 / 1, which made App Store Connect ignore the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Atlas konumunu haritada göstermek, hızını ölçmek ve seni yönlendirmek için kullanır. Konum geçmişin cihazından çıkmaz.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLAS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ATLAS_TEAM_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # Signing assets are installed by .github/workflows/testflight.yml.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(ATLAS_PROFILE_NAME)

  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLAS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AtlasKit/AppCoreTests
        - package: AtlasKit/LocationEngineTests
        - package: AtlasKit/SearchEngineTests
        - package: AtlasKit/RoutingEngineTests
        - AtlasUITests
    archive:
      config: Release
