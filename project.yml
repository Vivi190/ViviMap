# XcodeGen spec — the .xcodeproj is generated (CI runs `xcodegen generate`) and never committed.
name: Atlas
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The first TestFlight upload went out as 1.0 (1); stay on the 1.0 train, builds count up from the run number.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by the TestFlight workflow from the provisioning profile / team secrets.
    ATLAS_BUNDLE_ID: com.vivimap.atlas
    ATLAS_TEAM_ID: ""
    ATLAS_PROFILE_NAME: ""
    ATLAS_WIDGETS_PROFILE_NAME: ""
    # Set from the HERE_API_KEY secret by the TestFlight workflow; empty = live traffic hidden.
    HERE_API_KEY: ""

packages:
  AtlasKit:
    path: Packages/AtlasKit

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes: ["Offline/**"]
      # Offline packages (TestFlight pulls them from the offline-data release). A folder reference keeps
      # fonts/<stack>/<range>.pbf apart; optional, so CI builds without them.
      - path: App/Resources/Offline
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - package: AtlasKit
      - target: AtlasWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleDevelopmentRegion: tr
        # XcodeGen otherwise hard-codes 1.0 / 1, which made App Store Connect ignore the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape for car mounts: panels move into a left column (HomeScreen.isLandscape).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Atlas, konumunuzu haritada göstermek, hızınızı ölçmek ve sizi yönlendirmek için kullanır. Konum geçmişiniz cihazınızdan çıkmaz.
        # Navigation keeps guiding with the screen locked: GPS + spoken prompts.
        UIBackgroundModes:
          - location
          - audio
        # Read by TrafficEngine.HEREKey; ships inside the app (personal TestFlight use, ADR-7).
        HEREAPIKey: $(HERE_API_KEY)
        # Guidance on the lock screen, Dynamic Island and the CarPlay Dashboard (iOS 26).
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLAS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ATLAS_TEAM_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # Signing assets are installed by .github/workflows/testflight.yml.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(ATLAS_PROFILE_NAME)

  AtlasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
    dependencies:
      - package: AtlasKit
        product: AtlasActivity
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLAS_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(ATLAS_TEAM_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          # Its own App Store profile (WIDGETS_PROFILE_BASE64), installed by the TestFlight workflow.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(ATLAS_WIDGETS_PROFILE_NAME)

  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATLAS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AtlasKit/AppCoreTests
        - package: AtlasKit/LocationEngineTests
        - package: AtlasKit/SearchEngineTests
        - package: AtlasKit/RoutingEngineTests
        - package: AtlasKit/NavigationEngineTests
        - package: AtlasKit/TrafficEngineTests
        - package: AtlasKit/TripHistoryTests
        - package: AtlasKit/MapEngineTests
        - AtlasUITests
    archive:
      config: Release
