name: TestFlight

# Manual only: every upload consumes a build number and macOS minutes.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.6"
      DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
      DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for name in DIST_P12_BASE64 DIST_P12_PASSWORD PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (see docs/setup-testflight.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install signing certificate, profile and API key
        run: |
          KEYCHAIN="$RUNNER_TEMP/atlas.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          P12="$RUNNER_TEMP/dist.p12"
          echo "$DIST_P12_BASE64" | base64 --decode > "$P12"
          openssl pkcs12 -in "$P12" -passin env:DIST_P12_PASSWORD -noout \
            || { echo "::error::DIST_P12_PASSWORD does not open DIST_P12_BASE64"; exit 1; }
          # macOS rejected the OpenSSL-made legacy (3DES/SHA1) p12 as "passphrase not correct" although the
          # password opens it; fall back to re-packing with modern algorithms, then to separate key + cert.
          import_p12() { security import "$1" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; }
          if ! import_p12 "$P12"; then
            OSSL3="$(brew --prefix openssl@3)/bin/openssl"
            "$OSSL3" pkcs12 -in "$P12" -passin env:DIST_P12_PASSWORD -nodes -out "$RUNNER_TEMP/bundle.pem"
            "$OSSL3" pkcs12 -export -in "$RUNNER_TEMP/bundle.pem" -out "$RUNNER_TEMP/modern.p12" -passout env:DIST_P12_PASSWORD
            if ! import_p12 "$RUNNER_TEMP/modern.p12"; then
              echo "modern p12 rejected too; importing key and certificate separately"
              "$OSSL3" pkey -in "$RUNNER_TEMP/bundle.pem" -traditional -out "$RUNNER_TEMP/key.pem"
              "$OSSL3" x509 -in "$RUNNER_TEMP/bundle.pem" -outform DER -out "$RUNNER_TEMP/cert.cer"
              security import "$RUNNER_TEMP/key.pem" -A -k "$KEYCHAIN"
              security import "$RUNNER_TEMP/cert.cer" -A -k "$KEYCHAIN"
            fi
            rm -f "$RUNNER_TEMP/bundle.pem" "$RUNNER_TEMP/modern.p12" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.cer"
          fi
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "Apple Distribution" "$RUNNER_TEMP/identities.txt" \
            || { echo "::error::No Apple Distribution signing identity in the keychain"; exit 1; }

          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          UUID=$($PB -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$($PB -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$($PB -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$($PB -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          # Xcode 16+ reads UserData; older tools read MobileDevice — install in both.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          {
            echo "TEAM_ID=$TEAM"
            echo "PROFILE_NAME=$NAME"
            echo "BUNDLE_ID=${APP_ID#"$TEAM".}"
            echo "KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Atlas.xcodeproj \
            -scheme Atlas \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Atlas.xcarchive \
            -clonedSourcePackagesDirPath .spm \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ATLAS_BUNDLE_ID="$BUNDLE_ID" \
            ATLAS_TEAM_ID="$TEAM_ID" \
            ATLAS_PROFILE_NAME="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify --renderer github-actions

      - name: Export and upload to App Store Connect
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Atlas.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
